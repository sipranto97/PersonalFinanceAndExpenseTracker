<div class="page">
  <div class="card">

    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 2L11.5 7H16L12 10.5L13.5 16L9 13L4.5 16L6 10.5L2 7H6.5L9 2Z" fill="white"/>
        </svg>
      </div>
      <span class="brand-name">Personal Finance And Expense Tracker</span>
    </div>

    <h1>Create account</h1>
    <p class="subtitle">Sign up to start managing your expenses</p>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

      <!-- Username -->
      <div class="field" [class.has-error]="isInvalid('username')">
        <label for="username">Full Name</label>
        <input type="text" id="username" formControlName="username" placeholder="Your username" />
        <div class="error">Full name is required</div>
      </div>

      <!-- Email -->
      <div class="field" [class.has-error]="isInvalid('email')">
        <label for="email">Email address</label>
        <input type="email" id="email" formControlName="email" placeholder="you@example.com" />
        <div class="error">Please enter a valid email address</div>
      </div>

      <!-- Password -->
      <div class="field" [class.has-error]="isInvalid('password')">
        <label for="password">Password</label>

        <div class="input-wrap">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="••••••••"
          />

          <button class="eye-btn" type="button" (click)="showPassword = !showPassword">
            👁
          </button>
        </div>

        <div class="error">Password must be at least 8 characters</div>
      </div>

      <!-- Confirm Password -->
      <div class="field" [class.has-error]="isInvalid('confirmPassword')">
        <label for="confirmPassword">Confirm Password</label>

        <div class="input-wrap">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            formControlName="confirmPassword"
            placeholder="••••••••"
          />

          <button class="eye-btn" type="button" (click)="showConfirmPassword = !showConfirmPassword">
            👁
          </button>
        </div>

        <div class="error">Passwords do not match</div>
      </div>
      
      <button mat-raised-button color="primary" style="width: 100%; margin-bottom: 1.25rem;" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating account...' : 'Sign up' }}
      </button>

    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <p class="signup">
      Already have an account?
      <a routerLink="/sign-in">Sign in</a>
    </p>

  </div>
</div>
