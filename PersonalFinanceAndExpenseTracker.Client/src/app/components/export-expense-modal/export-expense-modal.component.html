<form class="modal-export-income"
  [formGroup]="exportForm"
  (ngSubmit)="export()">

  <h2>Export Expense</h2>

  <div class="form-group mt-4">

    <label class="radio-option">
      <input type="radio" name="exportAll" [value]="true" formControlName="exportAll">
      Export all data
    </label>

    <label class="radio-option">
      <input type="radio" name="exportAll" [value]="false" formControlName="exportAll">
      Export by date range
    </label>

  </div>

  <div class="date-range" *ngIf="!exportForm.value.exportAll">

    <div class="form-group mt-4">
      <label>Start Date</label>
      <input type="date" formControlName="startDate">
    </div>

    <div class="form-group mt-4">
      <label>End Date</label>
      <input type="date" formControlName="endDate">
    </div>

  </div>

  <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="modal-actions mt-4">

    <button mat-raised-button type="button" (click)="close()">
      Cancel
    </button>

    <button mat-raised-button color="primary" type="submit" class="ml-2">
      <i class="fas fa-file-excel"></i>
      Export
    </button>

  </div>

</form>
