<div
  class="sidebar"
  [class.collapsed]="collapsed"
  [class.mobile]="isMobile"
  [class.open]="mobileOpen">

  <div class="header">

    <div class="logo-container">
      <div class="logo">
        <i class="fas fa-cube"></i>
      </div>

      <span class="app-name" *ngIf="!collapsed">
        Expense Tracker
      </span>
    </div>

    <button
      *ngIf="!isMobile"
      class="toggle-btn"
      type="button"
      [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      (click)="toggleSidebar()">

      <i
        class="fas"
        [ngClass]="collapsed ? 'fa-chevron-right' : 'fa-chevron-left'">
      </i>

    </button>

    <button
      *ngIf="isMobile"
      class="toggle-btn"
      type="button"
      aria-label="Close menu"
      (click)="closeMenu.emit()">

      <i class="fas fa-xmark"></i>

    </button>

  </div>

  <div class="sidebar-profile" *ngIf="avatarUrl || fullName">

    <div class="profile-avatar">
      <img *ngIf="avatarUrl" [src]="avatarUrl" alt="Profile picture">
      <i *ngIf="!avatarUrl" class="fas fa-user"></i>
    </div>

    <span class="profile-name" *ngIf="!collapsed">{{ fullName }}</span>

  </div>

  <nav class="menu">

    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="menu-item"
      [title]="collapsed ? item.label : ''"
      (click)="closeMenu.emit()">

      <div class="menu-left">

        <i [class]="item.icon"></i>

        <span
          class="menu-text"
          *ngIf="!collapsed">
          {{ item.label }}
        </span>

      </div>
    </a>

  </nav>

  <div class="footer">

    <button class="logout-btn" (click)="logout()">

      <i class="fas fa-sign-out-alt"></i>

      <span *ngIf="!collapsed">
        Logout
      </span>

    </button>

  </div>

</div>
